<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollable Tabs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" id="popupContainer">
    <div class="header-bar">
      <!-- Left: search is always visible (it used to be hidden inside the filter menu) -->
      <div class="header-search" id="headerSearch">
        <span class="search-icon-wrap" id="searchIcon" aria-hidden="true"></span>
        <input type="search" id="searchInput" class="header-search-input"
               placeholder="Search tabs" autocomplete="off" spellcheck="false"
               aria-label="Search tabs by title or URL">
        <span class="filter-results" id="filterResults" aria-live="polite"></span>
        <button class="search-clear-btn" id="clearFiltersBtnInline" title="Clear search and filters (Esc)" aria-label="Clear search and filters"></button>
      </div>

      <div class="header-actions">
        <div class="filter-dropdown" id="filterDropdown">
          <button class="header-btn filter-dropdown-btn" id="filterBtn" title="Filter tabs" aria-label="Filter tabs" aria-haspopup="true" aria-expanded="false"></button>
          <div class="filter-menu" id="filterMenu" role="menu">
            <div class="filter-menu-title">Show only</div>
            <div class="filter-options">
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="audio">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span class="switch-label">Playing or muted</span>
              </label>
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="pinned">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span class="switch-label">Pinned</span>
              </label>
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="grouped">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span class="switch-label">In a group</span>
              </label>
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="ungrouped">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span class="switch-label">Not in a group</span>
              </label>
            </div>
            <div class="filter-footer">
              <span class="filter-menu-hint">Click again to turn off</span>
              <button class="clear-filters-btn" id="clearFiltersBtn">Clear all</button>
            </div>
          </div>
        </div>
        <button class="header-btn selection-mode-btn" id="selectionModeBtn" title="Select multiple tabs" aria-label="Select multiple tabs" aria-pressed="false"></button>
        <button class="header-btn theme-toggle-btn" id="themeToggleBtn" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="header-btn settings-btn" id="settingsBtn" title="Settings" aria-label="Settings"></button>
      </div>

      <!-- Far right, set apart: feedback isn't a tab action -->
      <div class="header-divider" aria-hidden="true"></div>
      <button class="bug-report-btn" id="bugReportBtn" title="Report a bug / send feedback" aria-label="Report a bug or send feedback"></button>
    </div>
    <div class="tab-container" id="tabContainer">
      <!-- Tabs will be rendered here -->
    </div>
    <!-- Selection mode toolbar: its own row, so the info bar below (tab info,
         navigation, counter) stays fully usable while selecting -->
    <div class="selection-bar" id="selectionBar" role="toolbar" aria-label="Selected tabs">
      <span class="selection-count" id="selectionCount">0</span>
      <div class="selection-summary">
        <span class="selection-summary-text" id="selectionSummary">Click tabs to select</span>
        <span class="selection-hint" id="selectionHint">Ctrl/Cmd+A selects all shown · Esc exits</span>
      </div>
      <button class="selection-action-btn" id="selectAllBtn" title="Select all tabs"></button>
      <button class="selection-action-btn" id="deselectAllBtn" title="Deselect all"></button>
      <div class="selection-bar-divider"></div>
      <button class="selection-action-btn" id="batchFrontBtn" title="Move selected tabs to the front (after pinned tabs)"></button>
      <button class="selection-action-btn" id="batchCloseBtn" title="Close selected tabs"></button>
      <button class="selection-action-btn" id="batchMuteBtn" title="Mute/Unmute selected tabs"></button>
      <button class="selection-action-btn" id="batchPinBtn" title="Pin/Unpin selected tabs"></button>
      <button class="selection-action-btn" id="batchWindowBtn" title="Move selected to new window"></button>
    </div>
    <div class="info-bar">
      <!-- Current and hovered tab share one slot: the hovered tab is shown while
           the pointer is over a tab, the current tab otherwise -->
      <div class="tab-info-slot" id="tabInfoSlot">
        <div class="current-tab-info" id="currentTabInfo" title="Scroll to current tab">
          <div class="info-label">Current Tab</div>
          <div class="current-tab-title" id="currentTabTitle">Loading...</div>
          <div class="current-tab-url" id="currentTabUrl"></div>
        </div>
        <div class="hovered-tab-info" id="hoveredTabInfo" aria-hidden="true">
          <div class="info-label">Hovered</div>
          <div class="hovered-tab-title" id="hoveredTabTitle"></div>
          <div class="hovered-tab-url" id="hoveredTabUrl"></div>
        </div>
      </div>
      <div class="tab-counter-wrapper">
        <button class="nav-btn-inline" id="scrollFirstBtn" title="Scroll to first" aria-label="Scroll to first">⏮</button>
        <button class="nav-btn-inline" id="scrollPageBackBtn" title="Scroll back one page" aria-label="Scroll back one page">◀</button>
        <button class="nav-btn-inline" id="scrollPageFwdBtn" title="Scroll forward one page" aria-label="Scroll forward one page">▶</button>
        <button class="nav-btn-inline" id="scrollLastBtn" title="Scroll to last" aria-label="Scroll to last">⏭</button>
        <button class="tab-counter" id="tabCounterWrapper" title="Scroll to current tab">
          <span class="tab-counter-icon"></span>
          <span id="tabCounter">On tab 0 of 0</span>
        </button>
      </div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
