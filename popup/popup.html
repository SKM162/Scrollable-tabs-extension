<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollable Tabs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" id="popupContainer">
    <div class="header-bar">
      <div class="header-actions">
        <button class="clear-filters-btn-inline" id="clearFiltersBtnInline" title="Clear filters"></button>
        <div class="filter-dropdown" id="filterDropdown">
          <button class="filter-dropdown-btn" id="filterBtn" title="Filter tabs"></button>
          <div class="filter-menu" id="filterMenu">
            <div class="filter-search-wrapper">
              <input type="text" id="searchInput" class="filter-search-input" placeholder="Search tabs...">
            </div>
            <div class="filter-options">
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="audio">
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
                <span class="switch-label">Audio</span>
              </label>
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="pinned">
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
                <span class="switch-label">Pinned</span>
              </label>
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="grouped">
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
                <span class="switch-label">Grouped</span>
              </label>
              <label class="filter-switch">
                <input type="radio" name="filter" data-filter="ungrouped">
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
                <span class="switch-label">Ungrouped</span>
              </label>
            </div>
            <div class="filter-footer">
              <span class="filter-results" id="filterResults"></span>
              <button class="clear-filters-btn" id="clearFiltersBtn">Clear</button>
            </div>
          </div>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle theme"></button>
        <button class="settings-btn" id="settingsBtn" title="Settings"></button>
      </div>
    </div>
    <div class="tab-container" id="tabContainer">
      <!-- Tabs will be rendered here -->
    </div>
    <div class="info-bar">
      <div class="current-tab-info" id="currentTabInfo">
        <div class="info-label">Current Tab</div>
        <div class="current-tab-title" id="currentTabTitle">Loading...</div>
        <div class="current-tab-url" id="currentTabUrl"></div>
      </div>
      <div class="hovered-tab-info" id="hoveredTabInfo">
        <div class="info-label">Hovered</div>
        <div class="hovered-tab-title" id="hoveredTabTitle"></div>
        <div class="hovered-tab-url" id="hoveredTabUrl"></div>
      </div>
      <div class="tab-counter-wrapper">
        <button class="nav-btn-inline" id="scrollFirstBtn" title="Scroll to first">⏮</button>
        <button class="nav-btn-inline" id="scrollPageBackBtn" title="Scroll back one page">◀</button>
        <button class="nav-btn-inline" id="scrollPageFwdBtn" title="Scroll forward one page">▶</button>
        <button class="nav-btn-inline" id="scrollLastBtn" title="Scroll to last">⏭</button>
        <div class="tab-counter" id="tabCounterWrapper" title="Go to current tab">
          <span class="tab-counter-icon"></span>
          <span id="tabCounter">On tab 0 of 0</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
